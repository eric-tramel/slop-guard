name: Pages

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing v* release tag to redeploy
        required: false
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}

      - name: Validate ref
        env:
          RELEASE_TAG: ${{ inputs.release_tag || '' }}
        run: |
          set -euo pipefail
          if [[ -n "${RELEASE_TAG}" ]]; then
            if [[ "${GITHUB_REF_TYPE}" != "branch" || "${GITHUB_REF_NAME}" == "main" ]]; then
              echo "Release redeploys must run from a non-main branch."
              exit 1
            fi
            if [[ "${RELEASE_TAG}" != v* ]]; then
              echo "Release redeploys require a v* tag."
              exit 1
            fi
            if ! git rev-parse --verify --quiet "refs/tags/${RELEASE_TAG}^{commit}" >/dev/null; then
              echo "Release tag ${RELEASE_TAG} does not exist."
              exit 1
            fi
            tag_commit="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
            if [[ "$(git rev-parse HEAD)" != "${tag_commit}" ]]; then
              echo "Checked-out commit does not match ${RELEASE_TAG}."
              exit 1
            fi
          elif [[ "${GITHUB_REF_TYPE}" == "branch" && "${GITHUB_REF_NAME}" != "main" ]]; then
            echo "Pages deployments only support main and v* tags."
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Configure git author
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

      - name: Prepare gh-pages branch
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"

          git fetch --force --tags origin

          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch --force origin gh-pages:gh-pages
            exit 0
          fi

          git switch --orphan gh-pages
          git rm -rf . >/dev/null 2>&1 || true
          git clean -fdx
          git commit --allow-empty -m "Initialize gh-pages"
          git push origin HEAD:gh-pages
          git switch --detach "${source_commit}"
          git fetch --force origin gh-pages:gh-pages

      - name: Install docs dependencies
        run: uv sync --group docs --locked

      - name: Update docs state
        env:
          RELEASE_TAG: ${{ inputs.release_tag || '' }}
        run: |
          set -euo pipefail

          has_stable_release_docs() {
            local versions_json
            versions_json="$(mktemp)"

            if ! git show gh-pages:docs/versions.json >"${versions_json}" 2>/dev/null; then
              rm -f "${versions_json}"
              return 1
            fi

            if uv run --group docs python -c 'import json, pathlib, sys; entries = json.loads(pathlib.Path(sys.argv[1]).read_text()); raise SystemExit(0 if any(entry["version"] != "dev" for entry in entries) else 1)' "${versions_json}"; then
              rm -f "${versions_json}"
              return 0
            fi

            rm -f "${versions_json}"
            return 1
          }

          if [[ "${GITHUB_REF_TYPE}" == "tag" || -n "${RELEASE_TAG}" ]]; then
            release_ref="${RELEASE_TAG:-${GITHUB_REF_NAME}}"
            release_version="${release_ref#v}"
            uv run --group docs python -m tools.docs_site deploy \
              --branch gh-pages \
              --deploy-prefix docs \
              --push \
              --update-aliases \
              --title "v${release_version}" \
              "${release_version}" \
              latest
            uv run --group docs mike set-default \
              --branch gh-pages \
              --deploy-prefix docs \
              --push \
              latest
          else
            uv run --group docs python -m tools.docs_site deploy \
              --branch gh-pages \
              --deploy-prefix docs \
              --push \
              --title "dev (main)" \
              dev

            if ! has_stable_release_docs; then
              uv run --group docs mike set-default \
                --branch gh-pages \
                --deploy-prefix docs \
                --push \
                dev
            fi
          fi

          git fetch --force origin gh-pages:gh-pages

      - name: Compose Pages artifact
        run: |
          set -euo pipefail

          rm -rf .pages-artifact
          mkdir -p .pages-artifact
          cp -R landing/. .pages-artifact/
          git archive gh-pages .nojekyll docs | tar -x -C .pages-artifact

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .pages-artifact

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
